name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows-exe:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore AudioLoopbackRecorder.csproj

      - name: Publish self-contained EXE
        run: >
          dotnet publish AudioLoopbackRecorder.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/win-x64

      - name: Copy setup files
        shell: pwsh
        run: |
          Copy-Item install-huddlescribe-protocol.ps1 publish/win-x64/
          Copy-Item diagnose-huddlescribe.ps1 publish/win-x64/
          Copy-Item README.md publish/win-x64/

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: HuddleAudioCapture-win-x64
          path: publish/win-x64/
